[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-slam-kitti"
version = "0.1.0"
description = "Stereo visual odometry and SLAM on the KITTI odometry benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "matplotlib>=3.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["stereo_slam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
